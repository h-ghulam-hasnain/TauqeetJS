name: NPM Publish (Production)

on:
  push:
    branches:
      - main
      - master

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases
      packages: write

    steps:
      # 1. Checkout with depth 2 to diff against the previous commit
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Setup Node.js + NPM registry
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the library
      - name: Build
        run: npm run build

      # 5. Run tests
      - name: Test
        run: npm test

      # 6. Check if version was bumped in the merged commit
      - name: Check if version changed
        id: version_check
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          CURR_VERSION=$(jq -r '.version' package.json)
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "✅ Version bumped: $PREV_VERSION → $CURR_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No version change. Skipping NPM publish."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 7. Publish to the official NPM "latest" tag
      - name: Publish to NPM (Latest)
        if: steps.version_check.outputs.changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 8. Create an official GitHub Release automatically
      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: v${{ steps.version_check.outputs.version }}
          generate_release_notes: true
