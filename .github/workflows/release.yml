name: Release & NPM Publish

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Every push (or merged PR) to main / master.
# Node.js: 24 (GitHub Actions deprecated Node 20 as of 2025-09-19)
#
# LOGIC:
#   new_version == old_version  →  Stop immediately. Do nothing.
#   new_version != old_version  →  Build, Test, Tag, Publish, Release.
#
# You bump the version in package.json manually — this workflow reads it.
# No git tag pushing required from your side.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write  # needed to push the git tag and create the GitHub Release
  id-token: write  # needed for npm provenance attestation

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Version check only. Fast. No Node, no npm.
  # ───────────────────────────────────────────────────────────────────────────
  check-version:
    name: 🔎 Check Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}

    steps:
      - name: Checkout (depth 2 to read previous commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare versions
        id: diff
        run: |
          OLD=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version' || echo "0.0.0")
          NEW=$(jq -r '.version' package.json)

          echo "version=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Version is still $NEW — looks like a docs/config update. Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Version changed: $OLD → $NEW. Proceeding with release."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build, Test, Tag, Publish, Release.
  #          Only runs when check-version says the version changed.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: 📦 Build, Publish & Release
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create & push git tag
        run: |
          TAG="v${{ needs.check-version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "tauqeet-js v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
