name: Auto Bump Version

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - master

jobs:
  bump-version:
    # Only run this job if the pull request was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A personal access token or GITHUB_TOKEN is required to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@h-ghulam-hasnain'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore: bump version to %s [skip ci]"

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          # This token is automatically generated by GitHub for this run only.
          # It is perfectly secure and requires no manual token management!
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
