name: CI (Pull Request)

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Every PR opened / updated against main or master.
# PURPOSE: Lint, build, test. Post a clear status comment.
#          Never publishes to NPM — that is release.yml's job on merge.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: 🧪 Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for version diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # ── Check whether this PR bumps the version ───────────────────────────
      - name: Check version bump
        id: version
        if: always()
        run: |
          BASE=$(git show origin/${{ github.base_ref }}:package.json | jq -r '.version')
          HEAD=$(jq -r '.version' package.json)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if [ "$BASE" != "$HEAD" ]; then
            echo "bumped=true"  >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Post (or update) a single clean status comment on the PR ─────────
      - name: Comment CI status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status  = "${{ job.status }}";
            const bumped  = "${{ steps.version.outputs.bumped }}";
            const base    = "${{ steps.version.outputs.base }}";
            const head    = "${{ steps.version.outputs.head }}";

            const icon = status === 'success' ? '✅' : '❌';

            const versionBlock = bumped === 'true'
              ? [
                  `> 📦 **Version bump:** \`${base}\` → \`${head}\``,
                  `> When this PR is merged, **release.yml** will build, publish \`v${head}\` to NPM, and create a GitHub Release automatically.`,
                ].join('\n')
              : `> ℹ️ No version bump — this looks like a docs / config update. Merging will **not** trigger an NPM release.`;

            const body = [
              `## ${icon} CI — \`${status}\``,
              '',
              '| Step | Result |',
              '|------|--------|',
              `| 🔍 Lint  | ${status === 'success' ? '✅ Passed' : '❌ Failed'} |`,
              `| 🏗️ Build | ${status === 'success' ? '✅ Passed' : '❌ Failed'} |`,
              `| 🧪 Test  | ${status === 'success' ? '✅ Passed' : '❌ Failed'} |`,
              '',
              versionBlock,
            ].join('\n');

            // Delete previous bot comments to keep the PR thread clean
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.startsWith('## ')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
