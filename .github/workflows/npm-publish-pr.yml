name: CI & NPM Publish (PR)

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      # 1. Checkout with full history (needed to diff against base)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js + NPM registry
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 3. Install dependencies (fast, deterministic)
      - name: Install dependencies
        run: npm ci

      # 4. Build the library (run your build script)
      - name: Build
        run: npm run build

      # 5. Run tests (fail fast if something breaks)
      - name: Test
        run: npm test

      # 6. Get version from base branch (e.g., main)
      - name: Get base version
        id: base_ver
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:package.json | jq -r '.version')
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT

      # 7. Get version from PR branch (current HEAD)
      - name: Get head version
        id: head_ver
        run: |
          HEAD_VERSION=$(jq -r '.version' package.json)
          echo "version=$HEAD_VERSION" >> $GITHUB_OUTPUT

      # 8. Compare versions
      - name: Check if version changed
        id: version_check
        run: |
          BASE="${{ steps.base_ver.outputs.version }}"
          HEAD="${{ steps.head_ver.outputs.version }}"
          if [ "$BASE" != "$HEAD" ]; then
            echo "✅ Version changed: $BASE → $HEAD"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No version change (docs-only PR). Skipping NPM publish."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 9. Publish to NPM (only if version changed AND PR is NOT from a fork)
      - name: Publish to NPM with PR tag
        if: |
          steps.version_check.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: npm publish --tag pr-${{ github.event.number }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 10. (Optional) Comment on PR to confirm publish status
      - name: Comment PR on publish
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.version_check.outputs.changed }}";
            const headVer = "${{ steps.head_ver.outputs.version }}";
            const baseVer = "${{ steps.base_ver.outputs.version }}";
            const msg = status === 'true'
              ? `🚀 **Published v${headVer}** to NPM under the tag \`pr-${{ github.event.number }}\`! (was v${baseVer})`
              : `📝 Docs-only update. No version bump needed.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });
